<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oráculo Dunder Mifflin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-oraculo">
        <h2>Oráculo Dunder Mifflin ☕</h2>
        <p>Qual sabedoria de Scranton vai guiar o seu dia?</p>
        
        <div class="frase-container">
            <!-- Inglês -->
            <blockquote id="frase-en" class="destaque-en">
                "Click the button to reveal your destiny."
            </blockquote>
            
            <!-- Português -->
            <blockquote id="frase-pt" class="traducao-pt">
                "Clique no botão para revelar seu destino."
            </blockquote>
            
            <p id="autor" class="autor-texto">- Management</p>
        </div>
        
        <button onclick="sortearFrase()">Tirar uma frase</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
